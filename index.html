<!DOCTYPE html>
<html lang="es">
<head>

      color: white;

      text-align: center;
    }

    .container {

      width: 100%;

      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px red) drop-shadow(0 0 30px red);

    h1 {

      font-size: 42px;
      text-shadow: 0 0 20px #00eaff, 0 0 40px #00eaff;
    }

    p {
      opacity: 0.9;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      margin: 10px auto;
      padding: 12px 20px;
      border-radius: 10px;
      background: #ff0000cc;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      box-shadow: 0 0 15px red, 0 0 30px red;
      transition: 0.2s;

      box-shadow: 0 0 25px red, 0 0 50px red;
